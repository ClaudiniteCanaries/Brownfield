# The established product canary: a Node library with its own tests, a
# default branch named trunk under classic branch protection, the engine
# from npm staging and the packs from stable, outside any fleet. A
# Claudinite engine release dispatches it with the version it just
# published. It waits until npm's staging tag names that version, then runs
# the engine/update task's update (cn update run). It passes when the one
# update PR targets trunk and leaves the workflow files out, its CI goes
# green, and it merges as merge-safe-changes says: by GitHub's auto-merge
# when nothing in it needs a person, else by review-updates, which plays the
# reviewer. Then cn selftest --repo passes on the new trunk and cn check
# world reports no finding, deprecations aside, that it did not report
# before the update. The growth job then plays the session history scenarios
# of a team that learns inside each session (S-07). When it fails, the report job opens a release-blocker
# issue naming the version in this repo, or comments on the one already
# open, which holds the release back from promotion to stable.
name: canary

on:
  workflow_dispatch:
    inputs:
      version:
        description: The engine version to update to, MAJOR.YMMDD.BUILD
        required: true
        type: string

permissions: {}

concurrency:
  group: canary
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: the version is MAJOR.YMMDD.BUILD
        run: |
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be MAJOR.YMMDD.BUILD, not \"$VERSION\""
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: trunk
          fetch-depth: 0
          persist-credentials: false
      # npm lists a version minutes before its CDN serves the tarballs, and
      # the update takes whatever the staging tag names.
      - name: wait until npm's staging tag serves the version
        run: |
          registry=https://registry.npmjs.org/@claudinite
          for _ in $(seq 1 90); do
            if [ "$(npm view @claudinite/cli dist-tags.staging 2>/dev/null)" = "$VERSION" ] \
              && curl -fsSI -o /dev/null "$registry/cli/-/cli-$VERSION.tgz" \
              && curl -fsSI -o /dev/null "$registry/cli-linux-x64/-/cli-linux-x64-$VERSION.tgz"; then
              echo "npm's staging tag serves @claudinite/cli@$VERSION"
              exit 0
            fi
            sleep 20
          done
          echo "::error::npm's staging tag did not name a served @claudinite/cli@$VERSION within 30 minutes"
          exit 1
      - name: download the pinned engine
        run: |
          { npx --yes @claudinite/setup@1.0.1 >&2 && .claudinite/bin/cn version; }
      # The findings, not the exit code, are what the run after the update
      # is compared with, so a failing check world here does not stop it.
      - name: findings before the update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          .claudinite/bin/cn check world > "$RUNNER_TEMP/before.txt" || true
          cat "$RUNNER_TEMP/before.txt"
      # An engine older than the installer-run update proposes its update
      # against main only, which a repo on trunk never merges, so such a pin
      # crosses by the released engine's own engine/update task.
      - name: which engine runs the update
        id: runner
        run: |
          usage=$(.claudinite/bin/cn 2>&1 || true)
          if grep -q '^  update run ' <<< "$usage"; then
            echo "cn=.claudinite/bin/cn" >> "$GITHUB_OUTPUT"
          else
            # The package's own bin runs the member's pinned engine, so run
            # the engine the package names instead.
            (cd "$RUNNER_TEMP" && npm pack -q "@claudinite/cli@$VERSION" >/dev/null && tar xzf "claudinite-cli-$VERSION.tgz")
            echo "cn=$(sh "$RUNNER_TEMP/package/launch" --from-package "$RUNNER_TEMP/package")" >> "$GITHUB_OUTPUT"
          fi
      - name: update through the installer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CN: ${{ steps.runner.outputs.cn }}
        run: |
          deadline=$((SECONDS + 90 * 60))
          listed=$((SECONDS + 10 * 60))
          pinned() { sed -n 's/^  version: "\(.*\)"$/\1/p' .claudinite/settings.yaml | head -n 1; }
          while :; do
            git fetch -q origin trunk
            git reset -q --hard FETCH_HEAD
            if [ "$(pinned)" = "$VERSION" ]; then
              echo "trunk pins $VERSION"
              break
            fi
            verdict=$($CN update run --repo . | tee -a "$RUNNER_TEMP/update.log" | grep '^update: ' | tail -n 1)
            echo "cn update run: $verdict"
            case $verdict in
              "update: opened #"*"engine $VERSION"* | "update: refreshed #"*"engine $VERSION"* | "update: #"*"engine $VERSION"*" is open and current")
                pr=${verdict#update: }
                pr=${pr#opened }
                pr=${pr#refreshed }
                pr=${pr#\#}
                pr=${pr%% *}
                gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" > "$RUNNER_TEMP/pr.json"
                base=$(jq -r .base.ref "$RUNNER_TEMP/pr.json")
                if [ "$base" != trunk ]; then
                  echo "::error::the update PR #$pr targets $base, not trunk, the default branch"
                  exit 1
                fi
                if gh pr diff "$pr" --name-only | grep -q '^\.github/workflows/'; then
                  echo "::error::the update PR #$pr commits workflow files, which the job token may not push"
                  exit 1
                fi
                if jq -r .body "$RUNNER_TEMP/pr.json" | grep -q 'expects these workflow files'; then
                  echo "the update PR #$pr names the workflow files it leaves out"
                fi
                for _ in $(seq 20); do
                  [ "$(gh pr checks "$pr" --json name --jq length 2>/dev/null || echo 0)" -gt 0 ] && break
                  sleep 15
                done
                if ! gh pr checks "$pr" --watch --interval 30; then
                  echo "::error::the update PR #$pr's CI is red"
                  exit 1
                fi
                gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" > "$RUNNER_TEMP/pr.json"
                body=$(jq -r .body "$RUNNER_TEMP/pr.json")
                if [ "$(jq -r '.auto_merge != null' "$RUNNER_TEMP/pr.json")" = true ]; then
                  echo "#$pr has auto-merge on: GitHub merges it"
                elif grep -q 'leaves for a person' <<< "$body"; then
                  echo "#$pr is held for a person: $(grep -o 'This update changes .*' <<< "$body")"
                  gh workflow run review-updates.yml --ref trunk
                # This repo keeps GitHub's Allow auto-merge off, as a repo
                # that never touched its settings does.
                elif grep -q 'turn on \*Allow auto-merge\*' <<< "$body"; then
                  echo "#$pr says auto-merge is not allowed here: $(grep -o 'Auto-merge could not be enabled.*' <<< "$body")"
                  gh workflow run review-updates.yml --ref trunk
                elif [ "$(jq -r .merged "$RUNNER_TEMP/pr.json")" != true ]; then
                  echo "::error::#$pr is neither held for a person nor set to auto-merge; its merge note: $(grep -E 'Auto-merge|Warning|merge level' <<< "$body")"
                  exit 1
                fi
                for _ in $(seq 60); do
                  [ "$(gh pr view "$pr" --json state --jq .state)" = MERGED ] && break
                  sleep 15
                done
                if [ "$(gh pr view "$pr" --json state --jq .state)" != MERGED ]; then
                  echo "::error::the update PR #$pr had not merged 15 minutes after its CI went green"
                  exit 1
                fi ;;
              "update: up to date")
                if [ "$SECONDS" -ge "$listed" ]; then
                  echo "::error::cn update run reports up to date, but trunk does not pin $VERSION"
                  exit 1
                fi
                echo "the channel does not list $VERSION yet; trying again" ;;
              *)
                echo "::error::the update to $VERSION stopped at: $verdict"
                exit 1 ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::$VERSION had not landed after 90 minutes; the last verdict was: $verdict"
              exit 1
            fi
            sleep 30
          done
      - name: trunk pins the version
        run: |
          git fetch -q origin trunk
          git reset -q --hard FETCH_HEAD
          pinned=$({ npx --yes @claudinite/setup@1.0.1 >&2 && .claudinite/bin/cn version; } | sed -n 1p)
          if [ "$pinned" != "$VERSION" ]; then
            echo "::error::trunk pins $pinned after the update, not $VERSION"
            exit 1
          fi
      - name: cn selftest --repo
        run: .claudinite/bin/cn selftest --repo .
      - name: the installer's update right after finds nothing to write
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npx --yes @claudinite/setup@1 update --repo . --dry-run --json > "$RUNNER_TEMP/apply.json"
          cat "$RUNNER_TEMP/apply.json"
          to=$(jq -r .to "$RUNNER_TEMP/apply.json")
          if [ "$to" != "$VERSION" ]; then
            echo "::error::the installer's update ran an engine reporting $to, not $VERSION"
            exit 1
          fi
      # A finding is keyed by its class, check and path, the line up to its
      # sentence, so a sentence naming the engine version does not read as
      # new.
      - name: no new finding in cn check world
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          .claudinite/bin/cn check world > "$RUNNER_TEMP/after.txt" || true
          cat "$RUNNER_TEMP/after.txt"
          # A run with no finding is a clean one, so grep matching nothing is no error.
          keys() { grep -E '^(break|finding|advisory) ' "$1" | sed 's/: .*//' | sort -u || true; }
          new=$(comm -13 <(keys "$RUNNER_TEMP/before.txt") <(keys "$RUNNER_TEMP/after.txt"))
          if [ -n "$new" ]; then
            echo "::error::cn check world on $VERSION reports findings it did not report before the update:"
            echo "$new"
            exit 1
          fi

  # S-07. A team member on a private repo that learns inside each session and
  # keeps no history (growthInSession, sessionHistory: none), and a throwaway
  # branch that grows nothing at all (noGrowth). The scheduler runs here are
  # dry runs, so no item is filed and nothing is closed; the executor runs
  # are real, to prove the environment gate on this repo's default branch.
  growth:
    name: S-07 growth in session
    needs: canary
    if: ${{ !cancelled() && needs.canary.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: write
      contents: write
      issues: read
      pull-requests: read
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: trunk
          fetch-depth: 0
          persist-credentials: true
      - name: download the engine trunk pins
        run: |
          pinned=$({ npx --yes @claudinite/setup@1.0.1 >&2 && .claudinite/bin/cn version; } | sed -n 1p)
          if [ "$pinned" != "$VERSION" ]; then
            echo "::error::trunk pins $pinned, not $VERSION: the update did not land"
            exit 1
          fi
      - name: S-07 the settings validate
        run: |
          grep -q '^  mode: growthInSession$' .claudinite/settings.yaml
          grep -q '^  sessionHistory: none$' .claudinite/settings.yaml
          .claudinite/bin/cn verify
      - name: S-07 a session end writes no branch
        run: |
          git ls-remote --heads origin | sed 's/.*refs\/heads\///' | sort > "$RUNNER_TEMP/branches-before"
          printf '{"hook_event_name":"SessionEnd","session_id":"canary-brownfield-%s","transcript_path":"%s","cwd":"%s"}' \
            "$VERSION" "$PWD/.claudinite/canary-fixtures/session.jsonl" "$PWD" \
            | .claudinite/bin/cn hook session-end | tee "$RUNNER_TEMP/session-end.txt"
          grep -q 'nothing captured: growth.mode is growthInSession' "$RUNNER_TEMP/session-end.txt" || {
            echo "::error::the session end did not say it stored nothing because growth.mode is growthInSession"
            exit 1
          }
          git ls-remote --heads origin | sed 's/.*refs\/heads\///' | sort | diff "$RUNNER_TEMP/branches-before" - || {
            echo "::error::the session end changed the branches of this repository"
            exit 1
          }
          decision=$(.claudinite/bin/cn growth from-session --decide)
          echo "from-session: $decision"
          case $decision in
            run*) ;;
            *)
              echo "::error::growthInSession should run growth-from-session, but the decision is: $decision"
              exit 1 ;;
          esac
      - name: S-07 nightly growth from pull requests and issues still files its item
        env:
          CLAUDINITE_WAKE: claudinite/growth-extract
        run: |
          .claudinite/bin/cn schedule run --dry-run | tee "$RUNNER_TEMP/schedule.txt"
          grep -q 'would create "\[claudinite-work\] claudinite/growth-extract"' "$RUNNER_TEMP/schedule.txt" || {
            echo "::error::the scheduler would not file claudinite/growth-extract under growthInSession"
            exit 1
          }
      - name: S-07 a throwaway branch on noGrowth plans no growth task and pushes nothing
        run: |
          git switch -q -c "canary/$VERSION-no-growth"
          sed -i 's/^  mode: growthInSession$/  mode: noGrowth/' .claudinite/settings.yaml
          grep -q '^  mode: noGrowth$' .claudinite/settings.yaml
          .claudinite/bin/cn verify
          CLAUDINITE_WAKE= .claudinite/bin/cn schedule run --dry-run | tee "$RUNNER_TEMP/schedule.txt"
          if grep -E 'asked claudinite/growth-|claudinite/growth-[a-z]+"' "$RUNNER_TEMP/schedule.txt"; then
            echo "::error::the scheduler planned a growth task on noGrowth"
            exit 1
          fi
          decision=$(.claudinite/bin/cn growth from-session --decide)
          echo "from-session: $decision"
          case $decision in
            skip*) ;;
            *)
              echo "::error::noGrowth should skip growth-from-session, but the decision is: $decision"
              exit 1 ;;
          esac
          git ls-remote --heads origin | sed 's/.*refs\/heads\///' | sort | diff "$RUNNER_TEMP/branches-before" - || {
            echo "::error::a branch appeared or went while the throwaway branch was tested"
            exit 1
          }
          git switch -q --detach origin/trunk
      # The environment only trunk may use is named by the executor job. The
      # run from trunk gets through it, the run from any other branch does not.
      - name: S-07 the executor runs from trunk inside the environment and not from another branch
        run: |
          run_of() {
            # $1 ref, $2 the time before dispatch; prints the id of the new run
            for _ in $(seq 30); do
              id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/claudinite-executor.yml/runs?event=workflow_dispatch&branch=$1&created=%3E%3D$2&per_page=5" \
                --jq '.workflow_runs[0].id // empty')
              [ -n "$id" ] && { echo "$id"; return 0; }
              sleep 10
            done
            return 1
          }
          finished() {
            deadline=$((SECONDS + 40 * 60))
            until [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1" --jq .status)" = completed ]; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::the deadline passed before executor run $1 finished"
                exit 1
              fi
              sleep 20
            done
          }
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run claudinite-executor.yml --repo "$GITHUB_REPOSITORY" --ref trunk
          id=$(run_of trunk "$started") || { echo "::error::the executor run from trunk never appeared"; exit 1; }
          finished "$id"
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq .conclusion)
          if [ "$conclusion" != success ]; then
            echo "::error::the executor run from trunk concluded $conclusion: https://github.com/$GITHUB_REPOSITORY/actions/runs/$id"
            exit 1
          fi
          echo "the executor run from trunk succeeded: $id"
          branch="canary/$VERSION-environment"
          git push -q origin "origin/trunk:refs/heads/$branch"
          trap 'git push -q origin --delete "$branch" || true' EXIT
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run claudinite-executor.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          other=$(run_of "$branch" "$started") || { echo "::error::the executor run from $branch never appeared"; exit 1; }
          finished "$other"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$other/jobs" > "$RUNNER_TEMP/jobs.json"
          conclusion=$(jq -r '.jobs[] | select(.name == "execute") | .conclusion' "$RUNNER_TEMP/jobs.json")
          ran=$(jq '[.jobs[] | select(.name == "execute") | .steps[]? | select(.conclusion == "success")] | length' "$RUNNER_TEMP/jobs.json")
          if [ "$conclusion" = success ] || [ "$ran" != 0 ]; then
            echo "::error::the executor run from $branch got past the environment's branch rule: job $conclusion, $ran step(s) ran"
            exit 1
          fi
          echo "the executor run from $branch was refused: job $conclusion, no step ran"

  report:
    needs: [canary, growth]
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: open or update the release-blocker issue
        run: |
          title="Release $VERSION fails the established product canary"
          body="The established product canary failed for engine $VERSION: $RUN

          Promotion to stable skips $VERSION while this issue is open. Close it once the failure is understood and either fixed in a later release or judged not to block this one."
          gh label create release-blocker --repo "$GITHUB_REPOSITORY" --force \
            --color B60205 --description "Holds a release back from promotion to stable"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label release-blocker --state open --json number,title \
            | jq -r --arg t "$title" 'map(select(.title == $t)) | first | .number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label release-blocker --body "$body"
          fi
